[package]
name = "icewire"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Asciiverse robot programming game: wire a rover's sensors, logic and drive on a bench, then send it into the arena on Europa, Rust + Ratatui"

[[bin]]
name = "icewire"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = 1
